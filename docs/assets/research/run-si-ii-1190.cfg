# Small smooth-gas smoke test for the Si II 1190 build.
[run]
nphot=100
random_seed=20260918
filename_prefix=build/SiII1190/smoke_
[emission]
population_ratio_2=0.4
position_mode=3
position_param=0.001
position_displacement=(0,0,0)
p_cloud=0
frequency_mode=3
frequency_param=300
[grid]
type=2
size=1000
ncells=(1,1,1)
filling_mode=1
temperature=1e5
Rmin=0
Rmax=1000
hydrogen=t 1
dust=n 0
velocity_mode=0
luminosity_mode=1
[output]
lya=ASCII_LYA
