; Small synthetic C II continuum-transfer example.
; The executable replaces <0> with the selected output filename prefix.
[run]
nphot = 4096
random_seed = 20261104
filename_prefix = <0>

[emission]
position_mode = 3
position_param = 0.001
p_cloud = 0
frequency_mode = 3
frequency_param = 600
cii_ratio_21 = 0.3

[grid]
random_seed = 31415
type = 2
size = 1000
ncells = (1,1,1)
filling_mode = 1
temperature = 10000
rmin = 0
rmax = 1000
hydrogen = n 0
dust = n 0
velocity_mode = 1
velocity_params = (0)
luminosity_mode = 1
clouds = (cloud1)
cloud_mode_schema = 2
; Use lattice placement with a buffer of 1.05.
cloud_placing_modes = (2)
cloud_filling_factors = (0.1)
cloud_placing_params = ((1.05))
cloud_motion_modes = ((2,1))
cloud_motion_params = ((25,80,0,0,0,0))
cloud_rin = (100)
cloud_rout = (950)

[cloud1]
type = 2
size = 50
ncells = (1,1,1)
filling_mode = 1
temperature = 18040.415746206498
rmin = 0
rmax = 50
hydrogen = c 3e15
dust = n 0
velocity_mode = 0
luminosity_mode = 1
set_all_absorbing_dust = False

[output]
lya = ASCII_LYA
