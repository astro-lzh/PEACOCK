; C II quickstart: a dust-free clumpy wind illuminated by a continuum source.
; Both CPU and CUDA runs use the accompanying complete cloud catalogue.
[run]
nphot = 100000
random_seed = 20261104
filename_prefix = <0>

[emission]
position_mode = 3
position_param = 0.001
p_cloud = 0
frequency_mode = 3
frequency_param = 600
cii_ratio_21 = 0.1

[grid]
random_seed = 31415
type = 2
size = 1000
ncells = (1,1,1)
filling_mode = 1
temperature = 10000
rmin = 0
rmax = 1000
hydrogen = n 0
dust = n 0
velocity_mode = 1
velocity_params = (0)
luminosity_mode = 1
clouds = (cloud1)
cloud_mode_schema = 2
cloud_placing_modes = (3)
cloud_filling_factors = (0.1)
cloud_motion_modes = ((2,3))
cloud_motion_params = ((25,80,10,1.5,100,950))
cloud_rin = (100)
cloud_rout = (950)

[cloud1]
type = 2
size = 50
ncells = (1,1,1)
filling_mode = 1
temperature = 10000
rmin = 0
rmax = 50
hydrogen = c 3e15
dust = n 0
velocity_mode = 0
luminosity_mode = 1
set_all_absorbing_dust = False

[output]
lya = ASCII_LYA
